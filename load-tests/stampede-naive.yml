config:
  target: "{{ $processEnvironment.TARGET_URL || 'http://localhost:3000' }}"
  phases:
    - duration: 1
      arrivalRate: 10000
      name: "Stampede Burst: 10,000 concurrent requests in 1s"
  http:
    timeout: 10

scenarios:
  - name: "Naive TTL Leaderboard Request (Stampede prone)"
    flow:
      - get:
          url: "/api/v1/leaderboard?page=1"
